name: Build iOS Tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make clang perl curl xz-utils

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build Tweak package
        run: |
          make package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ios-tweak-build
          path: |
            .theos/_/Library/MobileSubstrate/DynamicLibraries/*.dylib
          if-no-files-found: error
          retention-days: 7
