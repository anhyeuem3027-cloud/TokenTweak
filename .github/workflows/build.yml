
name: Build iOS Tweak

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            make \
            clang \
            perl \
            curl \
            xz-utils \
            unzip \
            fakeroot \
            libio-compress-lzma-perl \
            libtinfo5 \
            libncurses5

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install updated Swift Toolchain
        run: |
          mkdir -p "$THEOS/toolchain"
          rm -rf "$THEOS/toolchain/"*

          curl -fL \
            https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu20.04.tar.xz \
            | tar -xJf - -C "$THEOS/toolchain/"

      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"

          curl -fL \
            https://github.com/theos/sdks/archive/refs/heads/master.zip \
            -o sdks.zip

          TMP=$(mktemp -d)
          unzip -q sdks.zip -d "$TMP"

          cp -a "$TMP"/sdks-master/*.sdk "$THEOS/sdks/"

          rm -rf "$TMP" sdks.zip

      - name: Verify environment
        run: |
          echo "THEOS=$THEOS"
          find "$THEOS/toolchain" -name clang -type f
          ls -la "$THEOS/sdks"

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ios-tweak-build
          path: .theos/_/Library/MobileSubstrate/DynamicLibraries/*.dylib
          if-no-files-found: error
          retention-days: 7
